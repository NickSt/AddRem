name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    # This exact name is what branch protection requires as a status check.
    name: Build & Test (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # global-json-file is load-bearing, not cosmetic: the windows-latest image
      # currently ships SDK 10.0.201, which needs MSBuild 18 while the image has
      # 17, so builds fail without pinning back to the 10.0.1xx band.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore local tools
        run: dotnet tool restore

      # Runs before the build so a formatting-only failure is fast and unambiguous.
      - name: Check formatting
        run: dotnet csharpier check .

      - name: Restore
        run: dotnet restore AddRem.slnx

      - name: Build
        run: dotnet build AddRem.slnx -c Release --no-restore -warnaserror

      # Microsoft.Testing.Platform (opted into via global.json) takes the project
      # with --project, and extension options directly - there is no `--`
      # separator and no positional project path, unlike VSTest.
      - name: Unit tests
        run: >
          dotnet test --project tests/AddRem.Tests/AddRem.Tests.csproj
          -c Release --no-build
          --report-xunit-trx
          --coverage --coverage-output-format cobertura
          --results-directory artifacts/test

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: artifacts/test
          if-no-files-found: warn

  integration:
    # Deliberately reads the real machine. Informational until it has earned
    # trust; do not add it as a required status check while continue-on-error
    # is set, because it reports success either way.
    name: Integration Tests (Windows)
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Integration tests
        run: >
          dotnet test --project tests/AddRem.IntegrationTests/AddRem.IntegrationTests.csproj
          -c Release
          --report-xunit-trx
          --results-directory artifacts/integration

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: integration-results
          path: artifacts/integration
          if-no-files-found: warn
